<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K5 Launchpad</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Lexend:wght@400;700&display=swap" rel="stylesheet">

    <style>
      /* Prevent the "white flash" while the forest theme loads */
      body {
        margin: 0;
        background-color: #f0f7ff;
        font-family: 'Nunito', sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      (function() {
        try {
          // Look into the Stride Parent window for the user data object
          const strideUser = window.parent?.ENV?.user;

          if (strideUser) {
            // Save it to a global window object so App.jsx can see it
            window.studentInfo = {
              firstName: strideUser.first_name || "Student",
              fullName: strideUser.name || "K5 Student",
              email: strideUser.email || "No Email Found",
              grade: strideUser.grade_level || "K5"
            };
            console.log("Stride profile found:", window.studentInfo.firstName);
          } else {
            // Fallback: This is what you see when testing outside of Stride
            window.studentInfo = {
              firstName: "Explorer",
              fullName: "K5 Student",
              email: "testing@stride.com",
              grade: "4"
            };
          }
        } catch (e) {
          console.warn("Stride data blocked or not found. Using default.");
        }
      })();
    </script>

    <script type="module" src="/main.jsx"></script>
  </body>
</html>
